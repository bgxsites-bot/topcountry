<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN - Top Country</title>
<style>body{font-family:system-ui;background:#111;color:#fff;padding:15px}input,textarea,select,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:none;font-size:16px}button{background:#25D366;font-weight:bold}.card{background:#222;padding:10px;border-radius:10px;margin:8px 0;display:flex;gap:10px;align-items:center}img{width:60px;height:60px;object-fit:cover;border-radius:8px}</style>
</head>
<body>
<h3>ADMIN Top Country - NUVEM ✅</h3>
<input id="nome" placeholder="Nome ex: Bota Texana">
<input id="preco" type="number" placeholder="Preço 189.90" step="0.01">
<input id="imagem" placeholder="Link imagem https://...">
<textarea id="desc" placeholder="Descrição"></textarea>
<select id="categoria"><option value="botas">Botas</option><option value="botinas">Botinas</option><option value="coturnos">Coturnos</option></select>
<button onclick="salvar()">SALVAR NA NUVEM</button>
<div id="lista"></div>
<script>
const SUPABASE_URL="https://hdflyxsygkxpveyjtsan.supabase.co";
const SUPABASE_KEY="sb_publishable_jT6Lm8ABbiFTw_9r-XtmKA_w5R2qJm_";
async function salvar(){
 const p={nome:nome.value,preco:parseFloat(preco.value),imagem:imagem.value,descricao:desc.value,categoria:categoria.value,ordem:Date.now()};
 const r=await fetch(`${SUPABASE_URL}/rest/v1/produtos`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(p)});
 if(r.ok){alert('Salvo!');carregar();nome.value='';preco.value='';imagem.value='';desc.value=''}else alert('Erro:'+await r.text())
}
async function carregar(){
 const r=await fetch(`${SUPABASE_URL}/rest/v1/produtos?select=*&order=ordem.desc`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
 const d=await r.json(); lista.innerHTML=`<h4>Na nuvem: ${d.length}</h4>`+d.map(x=>`<div class=card><img src="${x.imagem}"><div style=flex:1><b>${x.nome}</b><br>R$ ${x.preco}</div><button onclick="del('${x.id}')" style=width:auto;background:#f44>X</button></div>`).join('');
}
async function del(id){if(confirm('Excluir?')){await fetch(`${SUPABASE_URL}/rest/v1/produtos?id=eq.${id}`,{method:'DELETE',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});carregar();}}
carregar();
</script>
</body>
</html>
