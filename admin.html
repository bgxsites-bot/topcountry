<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin TopCountry</title>
<style>body{font-family:Arial;padding:20px;max-width:500px;margin:auto;background:#f5f5f5}.card{background:white;padding:20px;border-radius:12px}input,textarea,select{width:100%;padding:12px;margin:8px 0 16px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{background:#111;color:white;padding:14px;width:100%;border:none;border-radius:8px;font-weight:bold}button:disabled{opacity:.5}#status{margin-top:15px;padding:12px;border-radius:8px;display:none}.success{background:#d1fae5}.error{background:#fee2e2}</style>
</head>
<body>
<div class="card">
<h2>Adicionar Produto</h2>
<input id="nome" placeholder="Nome"><input id="preco" type="number" step="0.01" placeholder="Preço">
<textarea id="descricao" placeholder="Descrição"></textarea>
<select id="categoria"><option value="bone">Boné</option><option value="camiseta">Camiseta</option><option value="calca">Calça</option><option value="outro">Outro</option></select>
<input id="imagem" type="file" accept="image/*">
<button id="btn" onclick="salvar()">Salvar Produto</button>
<div id="status"></div>
</div>
<script>
const WORKER_URL = "https://blue-disk-81ce.bgxsites.workers.dev";
async function salvar(){
  const btn=document.getElementById('btn'),status=document.getElementById('status');
  const nome=document.getElementById('nome').value.trim(),preco=document.getElementById('preco').value,descricao=document.getElementById('descricao').value.trim(),categoria=document.getElementById('categoria').value,file=document.getElementById('imagem').files[0];
  if(!nome||!preco||!file){alert('Preencha nome, preço e foto');return;}
  btn.disabled=true;btn.textContent='Enviando...';status.style.display='block';status.textContent='Fazendo upload...';
  try{
    const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
    const fileName=`prod_${Date.now()}.${file.name.split('.').pop()||'jpg'}`;
    const resp=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fileName,imageBase64:base64,nome,preco,descricao,categoria})});
    const json=await resp.json();if(!resp.ok||!json.ok) throw new Error(json.error||'Erro');
    status.className='success';status.textContent='✅ Produto adicionado! Aparece no site em 1-2 min.';document.getElementById('nome').value='';document.getElementById('preco').value='';document.getElementById('descricao').value='';document.getElementById('imagem').value='';
  }catch(e){status.className='error';status.textContent='❌ Erro: '+e.message;}finally{btn.disabled=false;btn.textContent='Salvar Produto';}
}
</script>
</body>
</html>
