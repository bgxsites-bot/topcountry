<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Top Country</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="tc-data.js"></script>
</head>
<body class="bg-[#111] text-white p-4">
<div class="max-w-4xl mx-auto">
<h1 class="text-2xl font-black mb-4">ADMIN - Top Country (Supabase)</h1>
<div class="bg-zinc-900 p-4 rounded-xl mb-6">
<h2 class="font-bold mb-2">Config Hero</h2>
<input id="hero_titulo" placeholder="Título" class="w-full mb-2 p-2 rounded text-black">
<input id="hero_tagline" placeholder="Tagline" class="w-full mb-2 p-2 rounded text-black">
<input id="hero_subtitulo" placeholder="Subtitulo" class="w-full mb-2 p-2 rounded text-black">
<input id="whatsapp" placeholder="WhatsApp 5538..." class="w-full mb-2 p-2 rounded text-black">
<label class="text-sm">Imagem Hero:</label>
<input id="hero_file" type="file" accept="image/*" class="mb-2">
<input id="hero_imagem" placeholder="URL imagem hero" class="w-full mb-2 p-2 rounded text-black">
<button onclick="salvarCfg()" class="bg-amber-500 text-black font-bold px-4 py-2 rounded">Salvar Config</button>
</div>
<div class="bg-zinc-900 p-4 rounded-xl mb-6">
<h2 class="font-bold mb-2">Novo Produto</h2>
<input id="p_nome" placeholder="Nome" class="w-full mb-2 p-2 rounded text-black">
<input id="p_preco" type="number" placeholder="Preço" class="w-full mb-2 p-2 rounded text-black">
<input id="p_preco_original" type="number" placeholder="Preço Original" class="w-full mb-2 p-2 rounded text-black">
<input id="p_categoria" placeholder="Categoria" class="w-full mb-2 p-2 rounded text-black">
<input id="p_file" type="file" accept="image/*" class="mb-2">
<input id="p_imagem" placeholder="URL imagem" class="w-full mb-2 p-2 rounded text-black">
<label class="flex items-center gap-2 mb-2"><input id="p_destaque" type="checkbox"> Destaque</label>
<button onclick="addProduto()" class="bg-green-500 text-black font-bold px-4 py-2 rounded">Adicionar Produto (Supabase)</button>
</div>
<div id="lista" class="space-y-2"></div>
</div>
<script>
async function salvarCfg(){
  const dados={id:1,hero_titulo:hero_titulo.value,hero_tagline:hero_tagline.value,hero_subtitulo:hero_subtitulo.value,hero_imagem:hero_imagem.value,whatsapp:whatsapp.value};
  const f=hero_file.files[0]; if(f) dados.hero_imagem=await uploadImagem(f);
  const {error}=await sb.from('config').upsert(dados); if(error) alert(error.message); else { alert('Salvo!'); loadData(); }
}
async function addProduto(){
  let url=p_imagem.value; const f=p_file.files[0]; if(f) url=await uploadImagem(f);
  const novo={nome:p_nome.value,preco:parseFloat(p_preco.value)||0,preco_original:p_preco_original.value?parseFloat(p_preco_original.value):null,categoria:p_categoria.value||'Geral',imagem:url,destaque:p_destaque.checked,ordem:Date.now()};
  const {error}=await sb.from('produtos').insert(novo); if(error) alert(error.message); else { alert('Produto salvo na NUVEM!'); p_nome.value=''; loadData(); renderLista(); }
}
async function renderLista(){
  await new Promise(r=>setTimeout(r,800)); const prods=getProdutos();
  lista.innerHTML='<h2 class="font-bold">Produtos: '+prods.length+'</h2>'+prods.map(p=>`<div class="bg-zinc-800 p-2 rounded flex justify-between"><span><b>${p.nome}</b> - R$${p.preco}</span><button onclick="delProd('${p.id}')" class="bg-red-600 px-2 py-1 rounded text-xs">Excluir</button></div>`).join('');
  const c=getCfg(); hero_titulo.value=c.hero_titulo||''; hero_tagline.value=c.hero_tagline||''; hero_subtitulo.value=c.hero_subtitulo||''; hero_imagem.value=c.hero_imagem||''; whatsapp.value=c.whatsapp||'';
}
async function delProd(id){ if(!confirm('Excluir?')) return; await sb.from('produtos').delete().eq('id',id); renderLista(); loadData(); }
setTimeout(renderLista,1500);
</script>
</body>
</html>
