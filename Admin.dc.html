<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — Top Country</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0B0B0B;color:#F4F0E8;font-family:Barlow,system-ui,sans-serif}
  input,select{font-family:Barlow,system-ui,sans-serif}
</style>
</helmet>

<div style="width:100%;max-width:520px;margin:0 auto;min-height:100vh;background:#0B0B0B;position:relative;padding-bottom:88px">

  <sc-if value="{{ !authed }}" hint-placeholder-val="{{ true }}">
    <div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px;gap:28px">
      <div style="text-align:center">
        <p style="font-family:'Bodoni Moda',serif;font-size:30px;letter-spacing:.06em;margin:0;color:#F4F0E8">TOP COUNTRY</p>
        <p style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:#B08A45;margin:10px 0 0">Painel administrativo</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <input value="{{ loginUser }}" onChange="{{ setLoginUser }}" placeholder="Usuário" style="height:52px;border-radius:2px;border:1px solid rgba(216,197,163,.25);background:#141010;color:#F4F0E8;padding:0 16px;font-size:16px">
        <input type="password" value="{{ loginPass }}" onChange="{{ setLoginPass }}" placeholder="Senha" style="height:52px;border-radius:2px;border:1px solid rgba(216,197,163,.25);background:#141010;color:#F4F0E8;padding:0 16px;font-size:16px">
        <sc-if value="{{ loginError }}" hint-placeholder-val="{{ false }}">
          <p style="color:#c96a4a;font-size:13px;margin:0">Usuário ou senha incorretos.</p>
        </sc-if>
        <button onClick="{{ doLogin }}" style="height:54px;border:none;background:#B08A45;color:#0B0B0B;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer">Entrar</button>
      </div>
      <p style="text-align:center;font-size:12px;color:rgba(244,240,232,.35);margin:0">Padrão: admin / top2024</p>
    </div>
  </sc-if>

  <sc-if value="{{ authed }}" hint-placeholder-val="{{ false }}">
    <div>
      <div style="position:sticky;top:0;z-index:5;background:rgba(11,11,11,.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(216,197,163,.12);padding:18px 20px;display:flex;align-items:center;justify-content:space-between">
        <p style="font-family:'Bodoni Moda',serif;font-size:19px;margin:0;color:#F4F0E8">{{ tabTitle }}</p>
        <button onClick="{{ doLogout }}" style="background:none;border:1px solid rgba(216,197,163,.3);color:#D8C5A3;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:9px 14px;border-radius:2px">Sair</button>
      </div>

      <sc-if value="{{ tabProdutos }}" hint-placeholder-val="{{ true }}">
        <div style="padding:16px">
          <sc-if value="{{ hasProducts }}" hint-placeholder-val="{{ false }}">
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px">
              <sc-for list="{{ products }}" as="p" hint-placeholder-count="6">
                <button onClick="{{ p.onEdit }}" style="position:relative;aspect-ratio:1;overflow:hidden;background:#141010;border:none;padding:0;cursor:pointer">
                  <img src="{{ p.imagem }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
                  <span style="position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(to top,rgba(11,11,11,.85),transparent);font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.1em;color:#F4F0E8;text-align:left;text-overflow:ellipsis;overflow:hidden;white-space:nowrap">{{ p.nome }}</span>
                </button>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ !hasProducts }}" hint-placeholder-val="{{ false }}">
            <p style="text-align:center;color:rgba(244,240,232,.4);padding:60px 20px;font-size:14px">Nenhum produto ainda. Toque no + para adicionar o primeiro.</p>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{ tabBanner }}" hint-placeholder-val="{{ false }}">
        <div style="padding:20px;display:flex;flex-direction:column;gap:20px">
          <label style="position:relative;display:block;aspect-ratio:16/9;border-radius:2px;overflow:hidden;background:#141010;cursor:pointer">
            <img src="{{ cfgHeroImage }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
            <span style="position:absolute;inset:0;background:rgba(11,11,11,.4);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#F4F0E8">Toque para trocar a foto</span>
            <input type="file" accept="image/*" capture="environment" onChange="{{ onHeroFile }}" style="position:absolute;inset:0;opacity:0;cursor:pointer">
          </label>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#B08A45">Título</label>
            <input value="{{ cfgHeroTitle }}" onChange="{{ setCfgHeroTitle }}" style="height:50px;border-radius:2px;border:1px solid rgba(216,197,163,.25);background:#141010;color:#F4F0E8;padding:0 14px;font-size:15px">
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#B08A45">Frase ("Seu estilo...")</label>
            <input value="{{ cfgHeroTagline }}" onChange="{{ setCfgHeroTagline }}" style="height:50px;border-radius:2px;border:1px solid rgba(216,197,163,.25);background:#141010;color:#F4F0E8;padding:0 14px;font-size:15px">
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#B08A45">Texto secundário</label>
            <input value="{{ cfgHeroSubtitle }}" onChange="{{ setCfgHeroSubtitle }}" style="height:50px;border-radius:2px;border:1px solid rgba(216,197,163,.25);background:#141010;color:#F4F0E8;padding:0 14px;font-size:15px">
          </div>
          <button onClick="{{ saveConfig }}" style="height:54px;border:none;background:#B08A45;color:#0B0B0B;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer">{{ saveLabel }}</button>
        </div>
      </sc-if>

      <sc-if value="{{ tabWhats }}" hint-placeholder-val="{{ false }}">
        <div style="padding:20px;display:flex;flex-direction:column;gap:20px">
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#B08A45">Número do WhatsApp (com DDI e DDD, só números)</label>
            <input value="{{ cfgWhatsapp }}" onChange="{{ setCfgWhatsapp }}" placeholder="5533991791610" style="height:50px;border-radius:2px;border:1px solid rgba(216,197,163,.25);background:#141010;color:#F4F0E8;padding:0 14px;font-size:15px">
          </div>
          <button onClick="{{ saveConfig }}" style="height:54px;border:none;background:#B08A45;color:#0B0B0B;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer">{{ saveLabel }}</button>
          <div style="height:1px;background:rgba(216,197,163,.12);margin:8px 0"></div>
          <p style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#B08A45;margin:0">Trocar usuário e senha do painel</p>
          <input value="{{ newUser }}" onChange="{{ setNewUser }}" placeholder="Novo usuário" style="height:50px;border-radius:2px;border:1px solid rgba(216,197,163,.25);background:#141010;color:#F4F0E8;padding:0 14px;font-size:15px">
          <input value="{{ newPass }}" onChange="{{ setNewPass }}" placeholder="Nova senha" style="height:50px;border-radius:2px;border:1px solid rgba(216,197,163,.25);background:#141010;color:#F4F0E8;padding:0 14px;font-size:15px">
          <button onClick="{{ saveCreds }}" style="height:50px;border:1px solid #B08A45;background:none;color:#B08A45;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer">{{ credsLabel }}</button>
        </div>
      </sc-if>

      <button onClick="{{ openNew }}" style="position:fixed;right:20px;bottom:96px;width:56px;height:56px;border-radius:50%;background:#B08A45;color:#0B0B0B;border:none;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;max-width:520px">+</button>

      <div style="position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:rgba(11,11,11,.97);backdrop-filter:blur(10px);border-top:1px solid rgba(216,197,163,.12);display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 0 max(10px,env(safe-area-inset-bottom))">
        <button onClick="{{ goProdutos }}" style="{{ tabBtnProdutos }}">
          <span style="display:block;width:18px;height:18px;border:1.5px solid currentColor;margin:0 auto 6px"></span>
          Produtos
        </button>
        <button onClick="{{ goBanner }}" style="{{ tabBtnBanner }}">
          <span style="display:block;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;margin:0 auto 6px"></span>
          Banner
        </button>
        <button onClick="{{ goWhats }}" style="{{ tabBtnWhats }}">
          <span style="display:block;width:18px;height:18px;border:1.5px solid currentColor;transform:rotate(45deg);margin:0 auto 6px"></span>
          WhatsApp
        </button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;max-width:520px;margin:0 auto">
      <div style="width:100%;max-height:92vh;overflow-y:auto;background:#100D0B;border-radius:14px 14px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom))">
        <div style="width:36px;height:4px;background:rgba(216,197,163,.3);border-radius:2px;margin:0 auto 18px"></div>
        <p style="font-family:'Bodoni Moda',serif;font-size:19px;margin:0 0 18px;color:#F4F0E8">{{ sheetTitle }}</p>

        <label style="position:relative;display:block;aspect-ratio:4/5;max-width:220px;margin:0 auto 20px;border-radius:2px;overflow:hidden;background:#141010;cursor:pointer">
          <img src="{{ editImagem }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
          <span style="position:absolute;inset:0;background:rgba(11,11,11,.4);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#F4F0E8;text-align:center;padding:12px">Toque para escolher foto</span>
          <input type="file" accept="image/*" capture="environment" onChange="{{ onProdFile }}" style="position:absolute;inset:0;opacity:0;cursor:pointer">
        </label>

        <div style="display:flex;flex-direction:column;gap:14px">
          <input value="{{ editNome }}" onChange="{{ setEditNome }}" placeholder="Nome do produto" style="height:50px;border-radius:2px;border:1px solid rgba(216,197,163,.25);background:#141010;color:#F4F0E8;padding:0 14px;font-size:15px">
          <input type="number" value="{{ editPreco }}" onChange="{{ setEditPreco }}" placeholder="Preço (opcional)" style="height:50px;border-radius:2px;border:1px solid rgba(216,197,163,.25);background:#141010;color:#F4F0E8;padding:0 14px;font-size:15px">
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ categoriaChips }}" as="c" hint-placeholder-count="7">
              <button onClick="{{ c.onPick }}" style="{{ c.style }}">{{ c.label }}</button>
            </sc-for>
          </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:22px">
          <sc-if value="{{ editIsExisting }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ deleteEditing }}" style="flex:1;height:52px;border:1px solid #7a4030;background:none;color:#c96a4a;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer">Excluir</button>
          </sc-if>
          <button onClick="{{ closeSheet }}" style="flex:1;height:52px;border:1px solid rgba(216,197,163,.3);background:none;color:#D8C5A3;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer">Cancelar</button>
          <button onClick="{{ saveEditing }}" style="flex:2;height:52px;border:none;background:#B08A45;color:#0B0B0B;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer">{{ prodSaveLabel }}</button>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    authed: false, loginUser: '', loginPass: '', loginError: false,
    tab: 'produtos', products: [], config: null,
    sheetOpen: false, editing: null, editNome: '', editPreco: '', editCategoria: 'Masculino', editImagem: '',
    saving: false, credsSaving: false, newUser: '', newPass: ''
  };

  async componentDidMount() {
    this.data = await import('./tc-data.js');
    const [products, config] = await Promise.all([this.data.listProducts(), this.data.getConfig()]);
    this.setState({ products, config });
  }

  categoryStyle(active) {
    return 'height:38px;padding:0 16px;border-radius:20px;font-family:\'Barlow Condensed\',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;' +
      (active ? 'background:#B08A45;color:#0B0B0B;border:1px solid #B08A45' : 'background:none;color:#D8C5A3;border:1px solid rgba(216,197,163,.3)');
  }

  tabBtnStyle(active) {
    return 'background:none;border:none;padding:6px 0;font-family:\'Barlow Condensed\',sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:' + (active ? '#B08A45' : 'rgba(244,240,232,.45)');
  }

  renderVals() {
    const s = this.state;
    const cats = this.data ? this.data.CATEGORIAS : ['Masculino', 'Feminino', 'Infantil', 'Botas', 'Acessórios', 'Bonés', 'Fivelas'];
    const cfg = s.config || { heroTitle: '', heroTagline: '', heroSubtitle: '', heroImage: '', whatsapp: '' };

    return {
      authed: s.authed,
      loginUser: s.loginUser, loginPass: s.loginPass, loginError: s.loginError,
      setLoginUser: e => this.setState({ loginUser: e.target.value, loginError: false }),
      setLoginPass: e => this.setState({ loginPass: e.target.value, loginError: false }),
      doLogin: () => {
        if (this.data && this.data.checkAuth(s.loginUser, s.loginPass)) this.setState({ authed: true, loginError: false });
        else this.setState({ loginError: true });
      },
      doLogout: () => this.setState({ authed: false, loginUser: '', loginPass: '' }),

      tabTitle: s.tab === 'produtos' ? 'Produtos' : s.tab === 'banner' ? 'Banner & Textos' : 'WhatsApp & Acesso',
      tabProdutos: s.tab === 'produtos', tabBanner: s.tab === 'banner', tabWhats: s.tab === 'whats',
      goProdutos: () => this.setState({ tab: 'produtos' }),
      goBanner: () => this.setState({ tab: 'banner' }),
      goWhats: () => this.setState({ tab: 'whats' }),
      tabBtnProdutos: this.tabBtnStyle(s.tab === 'produtos'),
      tabBtnBanner: this.tabBtnStyle(s.tab === 'banner'),
      tabBtnWhats: this.tabBtnStyle(s.tab === 'whats'),

      hasProducts: s.products.length > 0,
      products: s.products.map(p => ({
        ...p,
        onEdit: () => this.openEdit(p)
      })),

      cfgHeroImage: cfg.heroImage, cfgHeroTitle: cfg.heroTitle, cfgHeroTagline: cfg.heroTagline, cfgHeroSubtitle: cfg.heroSubtitle, cfgWhatsapp: cfg.whatsapp,
      setCfgHeroTitle: e => this.setState({ config: { ...s.config, heroTitle: e.target.value } }),
      setCfgHeroTagline: e => this.setState({ config: { ...s.config, heroTagline: e.target.value } }),
      setCfgHeroSubtitle: e => this.setState({ config: { ...s.config, heroSubtitle: e.target.value } }),
      setCfgWhatsapp: e => this.setState({ config: { ...s.config, whatsapp: e.target.value.replace(/\D/g, '') } }),
      onHeroFile: async e => {
        const f = e.target.files && e.target.files[0];
        if (!f || !this.data) return;
        const dataUrl = await this.data.resizeImage(f, 1600, 0.85);
        this.setState({ config: { ...this.state.config, heroImage: dataUrl } });
      },
      saveLabel: s.saving ? 'Salvando…' : 'Salvar',
      saveConfig: async () => {
        if (!this.data) return;
        this.setState({ saving: true });
        await this.data.saveConfig(this.state.config);
        this.setState({ saving: false });
      },

      newUser: s.newUser, newPass: s.newPass,
      setNewUser: e => this.setState({ newUser: e.target.value }),
      setNewPass: e => this.setState({ newPass: e.target.value }),
      credsLabel: s.credsSaving ? 'Salvando…' : 'Salvar novo acesso',
      saveCreds: () => {
        if (!this.data || !this.state.newUser || !this.state.newPass) return;
        this.setState({ credsSaving: true });
        this.data.setCreds(this.state.newUser, this.state.newPass);
        setTimeout(() => this.setState({ credsSaving: false, newUser: '', newPass: '' }), 400);
      },

      openNew: () => this.openEdit(null),
      sheetOpen: s.sheetOpen,
      sheetTitle: s.editing ? 'Editar produto' : 'Novo produto',
      editIsExisting: !!s.editing,
      editNome: s.editNome, editPreco: s.editPreco, editImagem: s.editImagem,
      setEditNome: e => this.setState({ editNome: e.target.value }),
      setEditPreco: e => this.setState({ editPreco: e.target.value }),
      onProdFile: async e => {
        const f = e.target.files && e.target.files[0];
        if (!f || !this.data) return;
        const dataUrl = await this.data.resizeImage(f, 1000, 0.82);
        this.setState({ editImagem: dataUrl });
      },
      categoriaChips: cats.map(c => ({
        label: c,
        onPick: () => this.setState({ editCategoria: c }),
        style: this.categoryStyle(s.editCategoria === c)
      })),
      closeSheet: () => this.setState({ sheetOpen: false, editing: null }),
      prodSaveLabel: s.saving ? 'Salvando…' : 'Salvar',
      saveEditing: async () => {
        if (!this.data || !this.state.editNome) return;
        this.setState({ saving: true });
        const payload = {
          id: this.state.editing ? this.state.editing.id : undefined,
          nome: this.state.editNome,
          categoria: this.state.editCategoria,
          preco: this.state.editPreco ? parseFloat(this.state.editPreco) : null,
          imagem: this.state.editImagem || 'assets/images/hero/hero.jpg'
        };
        await this.data.saveProduct(payload);
        const products = await this.data.listProducts();
        this.setState({ products, saving: false, sheetOpen: false, editing: null });
      },
      deleteEditing: async () => {
        if (!this.data || !this.state.editing) return;
        await this.data.deleteProduct(this.state.editing.id);
        const products = await this.data.listProducts();
        this.setState({ products, sheetOpen: false, editing: null });
      }
    };
  }

  openEdit(p) {
    this.setState({
      sheetOpen: true,
      editing: p,
      editNome: p ? p.nome : '',
      editPreco: p && p.preco != null ? String(p.preco) : '',
      editCategoria: p ? p.categoria : 'Masculino',
      editImagem: p ? p.imagem : ''
    });
  }
}
</script>
</body>
</html>
