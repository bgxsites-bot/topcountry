<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animação</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow-x: hidden;
      overscroll-behavior: none;
      scrollbar-width: thin;
      scrollbar-color: #222222 #000000;
    }

    .scroll-container {
      height: 700vh;
      width: 100%;
      position: relative;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      pointer-events: none;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #222222;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #444444;
    }
  </style>
</head>
<body>
  <div class="scroll-container">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    (function () {
      'use strict';

      const TOTAL_FRAMES = 259;
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      // Cache de frames
      const images = new Array(TOTAL_FRAMES + 1);
      const loaded = new Array(TOTAL_FRAMES + 1).fill(false);
      const loading = new Array(TOTAL_FRAMES + 1).fill(false);

      // Estado de rolagem e física inercial
      let targetY = 0;
      let currentY = 0;
      let isWheeling = false;
      let wheelTimer = null;
      let isTouchpad = false;

      let currentFrame = 1;
      let lastDrawnFrame = -1;
      let lastDrawnImg = null;
      let lastTime = performance.now();

      function getFrameUrl(index) {
        const padded = String(index).padStart(3, '0');
        return `ezgif-frame-${padded}.jpg`;
      }

      function getMaxScroll() {
        return Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
      }

      // Redimensionamento responsivo com suporte a telas de alta densidade (Retina/DPI)
      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth;
        const h = window.innerHeight;

        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        lastDrawnFrame = -1;
        lastDrawnImg = null;
        draw(Math.min(Math.max(Math.round(currentFrame), 1), TOTAL_FRAMES));
      }

      // Busca o frame disponível mais próximo do índice alvo
      function findBestAvailableFrame(index) {
        if (loaded[index] && images[index]) return images[index];

        for (let offset = 1; offset < TOTAL_FRAMES; offset++) {
          const prev = index - offset;
          if (prev >= 1 && loaded[prev] && images[prev]) return images[prev];
          const next = index + offset;
          if (next <= TOTAL_FRAMES && loaded[next] && images[next]) return images[next];
        }

        for (let i = 1; i <= TOTAL_FRAMES; i++) {
          if (loaded[i] && images[i]) return images[i];
        }
        return null;
      }

      // Renderização no Canvas
      function draw(frameIndex) {
        const img = findBestAvailableFrame(frameIndex);
        if (!img || !img.naturalWidth) return;

        if (frameIndex === lastDrawnFrame && img === lastDrawnImg) return;

        const cw = canvas.width;
        const ch = canvas.height;
        const iw = img.naturalWidth;
        const ih = img.naturalHeight;

        // Proporção sem cortes (contain)
        const scale = Math.min(cw / iw, ch / ih);
        const dw = Math.round(iw * scale);
        const dh = Math.round(ih * scale);
        const dx = Math.round((cw - dw) / 2);
        const dy = Math.round((ch - dh) / 2);

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, dx, dy, dw, dh);

        lastDrawnFrame = frameIndex;
        lastDrawnImg = img;
      }

      // Gerenciador de pré-carregamento com fila e decodificação assíncrona
      const MAX_CONCURRENT = 6;
      let activeDownloads = 0;
      const loadQueue = [];

      function enqueueFrame(index, urgent = false) {
        if (index < 1 || index > TOTAL_FRAMES) return;
        if (loaded[index] || loading[index]) return;

        const existingIdx = loadQueue.indexOf(index);
        if (urgent) {
          if (existingIdx !== -1) loadQueue.splice(existingIdx, 1);
          loadQueue.unshift(index);
        } else {
          if (existingIdx === -1) {
            loadQueue.push(index);
          }
        }
        pumpQueue();
      }

      function pumpQueue() {
        while (activeDownloads < MAX_CONCURRENT && loadQueue.length > 0) {
          const index = loadQueue.shift();
          if (loaded[index] || loading[index]) continue;

          activeDownloads++;
          loading[index] = true;

          const img = new Image();
          img.src = getFrameUrl(index);

          const onDone = () => {
            images[index] = img;
            loaded[index] = true;
            loading[index] = false;
            activeDownloads--;

            // Atualiza imediatamente se o usuário estiver parado ou próximo deste frame
            const curTarget = Math.min(Math.max(Math.round(currentFrame), 1), TOTAL_FRAMES);
            if (curTarget === index || (Math.abs(curTarget - index) <= 2 && lastDrawnImg !== images[curTarget])) {
              draw(curTarget);
            }

            pumpQueue();
          };

          const onError = () => {
            loading[index] = false;
            activeDownloads--;
            pumpQueue();
          };

          if ('decode' in img) {
            img.decode().then(onDone).catch(() => {
              if (img.complete && img.naturalWidth) {
                onDone();
              } else {
                img.onload = onDone;
                img.onerror = onError;
              }
            });
          } else {
            img.onload = onDone;
            img.onerror = onError;
          }
        }
      }

      // Priorização dinâmica dos quadros em torno da posição atual
      function prioritizeAround(index) {
        const center = Math.round(index);
        for (let r = 0; r <= 8; r++) {
          if (r === 0) enqueueFrame(center, true);
          else {
            enqueueFrame(center + r, true);
            enqueueFrame(center - r, true);
          }
        }
      }

      // Estratégia de ondas progressivas
      function initPreload() {
        enqueueFrame(1, true);

        // Onda 1: Keyframes distribuídos por toda a rotação 360
        for (let i = 1; i <= TOTAL_FRAMES; i += 8) {
          enqueueFrame(i, false);
        }
        enqueueFrame(TOTAL_FRAMES, false);

        // Onda 2: Keyframes intermediários de meio-passo
        for (let i = 5; i <= TOTAL_FRAMES; i += 8) {
          enqueueFrame(i, false);
        }

        // Onda 3: Passos de quarto
        for (let i = 3; i <= TOTAL_FRAMES; i += 4) {
          enqueueFrame(i, false);
        }

        // Onda 4: Quadros restantes para perfeição total
        for (let i = 2; i <= TOTAL_FRAMES; i += 2) {
          enqueueFrame(i, false);
        }
      }

      // Rolagem suave e inercial
      window.addEventListener('wheel', (e) => {
        e.preventDefault();
        isWheeling = true;

        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => {
          isWheeling = false;
        }, 180);

        let delta = e.deltaY;
        if (e.deltaMode === 1) delta *= 35;
        else if (e.deltaMode === 2) delta *= window.innerHeight;

        // Distinção entre touchpad (alta frequência) e roda do mouse (degraus discretos)
        if (Math.abs(delta) < 40 && !Number.isInteger(delta)) {
          isTouchpad = true;
        } else {
          isTouchpad = false;
        }

        const maxScroll = getMaxScroll();
        targetY = Math.max(0, Math.min(targetY + delta, maxScroll));

        const progress = maxScroll > 0 ? targetY / maxScroll : 0;
        const estFrame = 1 + progress * (TOTAL_FRAMES - 1);
        prioritizeAround(estFrame);
      }, { passive: false });

      // Sincronização direta com barra de rolagem e dispositivos touch
      window.addEventListener('scroll', () => {
        const nativeY = window.pageYOffset || document.documentElement.scrollTop || 0;
        if (!isWheeling) {
          targetY = nativeY;
          currentY = nativeY;
          const maxScroll = getMaxScroll();
          const progress = maxScroll > 0 ? currentY / maxScroll : 0;
          prioritizeAround(1 + progress * (TOTAL_FRAMES - 1));
        }
      }, { passive: true });

      // Suporte a teclado
      window.addEventListener('keydown', (e) => {
        const maxScroll = getMaxScroll();
        let step = 0;
        if (e.key === 'ArrowDown') step = 90;
        else if (e.key === 'ArrowUp') step = -90;
        else if (e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)) step = window.innerHeight * 0.8;
        else if (e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) step = -window.innerHeight * 0.8;
        else if (e.key === 'Home') { targetY = 0; isWheeling = true; }
        else if (e.key === 'End') { targetY = maxScroll; isWheeling = true; }

        if (step !== 0) {
          e.preventDefault();
          targetY = Math.max(0, Math.min(targetY + step, maxScroll));
          isWheeling = true;
          clearTimeout(wheelTimer);
          wheelTimer = setTimeout(() => { isWheeling = false; }, 200);

          const progress = maxScroll > 0 ? targetY / maxScroll : 0;
          prioritizeAround(1 + progress * (TOTAL_FRAMES - 1));
        }
      });

      // Libera bloqueio em clique manual
      window.addEventListener('mousedown', () => {
        isWheeling = false;
      });
      window.addEventListener('touchstart', () => {
        isWheeling = false;
      }, { passive: true });

      // Loop de animação
      function renderLoop(currentTime) {
        const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
        lastTime = currentTime;

        const maxScroll = getMaxScroll();

        if (isWheeling) {
          const friction = isTouchpad ? 14.0 : 8.5;
          const factor = 1 - Math.exp(-friction * dt);
          currentY += (targetY - currentY) * factor;

          if (Math.abs(targetY - currentY) < 0.1) {
            currentY = targetY;
          }
          window.scrollTo(0, currentY);
        } else {
          const nativeY = window.pageYOffset || document.documentElement.scrollTop || 0;
          currentY = nativeY;
          targetY = nativeY;
        }

        const progress = maxScroll > 0 ? Math.min(Math.max(currentY / maxScroll, 0), 1) : 0;
        const targetFrame = 1 + progress * (TOTAL_FRAMES - 1);

        const frameFactor = 1 - Math.exp(-12.0 * dt);
        currentFrame += (targetFrame - currentFrame) * frameFactor;

        const frameToRender = Math.min(Math.max(Math.round(currentFrame), 1), TOTAL_FRAMES);
        draw(frameToRender);

        requestAnimationFrame(renderLoop);
      }

      window.addEventListener('resize', resizeCanvas);

      // Início
      currentY = window.pageYOffset || document.documentElement.scrollTop || 0;
      targetY = currentY;
      const initialProgress = getMaxScroll() > 0 ? currentY / getMaxScroll() : 0;
      currentFrame = 1 + initialProgress * (TOTAL_FRAMES - 1);

      resizeCanvas();
      initPreload();
      prioritizeAround(currentFrame);
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
